-top:12px}.studycontrols select{flex:1;max-width:100%}.topline{align-items:flex-start}h1{font-size:26px}.summary{grid-template-columns:repeat(3,1fr)}.stat{padding:13px 10px}.stat strong{font-size:21px}.stat span{font-size:11px}.stat small{display:none}.editorgrid{display:block}.panel{padding:19px}.island{left:12px;right:12px;bottom:12px;transform:none;padding:10px 12px;gap:7px;justify-content:space-between}.island .quiet{padding:8px}.island small{font-size:9px}.island button{font-size:11px;padding:9px 12px}.sheet{padding:20px 18px 100px}.sheet .island{left:12px;right:12px;max-width:none}.topline .primary{font-size:12px}.row{flex-wrap:wrap}.orderfacts{gap:20px}.row>*{min-width:120px}.photobox{overflow:auto}.thumb{width:32px}.notice{font-size:11px}}

</style></head><body><div class="navscrim" onclick="toggleNav(false)"></div><aside><div class="brand"><b>ƒƒ</b> FULLY FLARED</div><div class="store">◉ &nbsp; Fully Flared Store <span class="muted" style="float:right">⌄</span></div><nav aria-label="Main navigation"><button onclick="navigate('home')"><span class="navicon">⌂</span>Overview</button><button id="nav-orders" onclick="navigate('orders')"><span class="navicon">▣</span>Orders</button><button id="nav-products" onclick="navigate('products')"><span class="navicon">◇</span>Products</button><button onclick="unavailable('Inventory')"><span class="navicon">▤</span>Inventory</button><button onclick="unavailable('Customers')"><span class="navicon">♧</span>Customers</button><div class="navgroup">Store</div><button onclick="unavailable('Discounts')"><span class="navicon">%</span>Discounts</button><button onclick="unavailable('Content')"><span class="navicon">▧</span>Content</button><button onclick="unavailable('Analytics')"><span class="navicon">↗</span>Analytics</button><div class="navgroup">Manage</div><button onclick="unavailable('Settings')"><span class="navicon">⚙</span>Settings</button></nav><div class="asidebottom"><span class="avatar">N</span>Nic &nbsp; <span class="small">Store owner</span></div></aside><main><button class="mobilemenu" onclick="toggleNav(true)" aria-label="Open navigation">☰ &nbsp; Menu</button><div class="studybar"><div><span class="eyebrow">Gate 0 / Design study</span><div class="small muted" style="margin-top:7px">Simulated data · No commerce writes</div></div><div class="studycontrols"><select id="direction" aria-label="Design direction" onchange="changeDirection(this.value)"><option value="workspace">A · Full workspaces</option><option value="panel">B · Contextual panels</option></select><select id="draftmode" aria-label="Draft storage" onchange="changeStorage(this.value)"><option value="memory">Memory Save/Publish</option><option value="persistent">IndexedDB recovery</option></select><select id="scenario" aria-label="Scenario" onchange="setScenario(this.value)"><option value="normal">Normal state</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="denied">Permission denied</option><option value="success">Success</option><option value="error">Error</option><option value="uncertain">Uncertain submission</option><option value="conflict">Conflict</option><option value="storage">Storage unavailable</option></select></div></div><div id="app"></div></main><div id="overlay"></div><div id="island"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const products=[{id:'p1',title:'Everyday Heavyweight Tee',sku:'FF-TEE-BLK-M',price:4800,stock:124,status:'Active',variants:6,color:'dark',icon:'♜',description:'A considered everyday essential. Cut from substantial cotton with a relaxed fit.'},{id:'p2',title:'Canvas Carryall',sku:'FF-BAG-NAT',price:6200,stock:38,status:'Active',variants:1,color:'',icon:'▱',description:'A durable canvas bag for wherever the day takes you.'},{id:'p3',title:'Studio Overshirt',sku:'FF-SHT-SND-L',price:12800,stock:0,status:'Draft',variants:4,color:'sand',icon:'♜',description:'An easy layer with a structured shape.'},{id:'p4',title:'Everyday Heavyweight Tee · Stone',sku:'FF-TEE-STN-M',price:4800,stock:86,status:'Active',variants:6,color:'',icon:'♜',description:'Our everyday essential in a soft stone finish.'},{id:'p5',title:'Six Panel Cap',sku:'FF-CAP-OLV',price:3200,stock:52,status:'Active',variants:1,color:'sand',icon:'⌒',description:'A low profile cap with an adjustable fit.'}];
const orders=[{id:'o1',number:'#FF1048',name:'Alex Morgan',email:'alex@example.com',total:9600,status:'Unfulfilled',date:'Today, 10:42 am',items:2},{id:'o2',number:'#FF1047',name:'Jamie Chen',email:'jamie@example.com',total:6200,status:'Unfulfilled',date:'Today, 9:18 am',items:1},{id:'o3',number:'#FF1046',name:'Taylor Brooks',email:'taylor@example.com',total:12800,status:'Shipped',date:'Yesterday, 4:30 pm',items:1},{id:'o4',number:'#FF1045',name:'Sam Rivera',email:'sam@example.com',total:4800,status:'Return requested',date:'Yesterday, 2:16 pm',items:1}];
const state={page:'products',direction:'workspace',storage:'memory',scenario:'normal',tab:'All',query:'',record:null,edit:null,selected:new Set(),draftState:'Editing',newProduct:false,trigger:null,storageError:false};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+(n/100).toFixed(2);let dbPromise;
function db(){return dbPromise??=(new Promise((resolve,reject)=>{const q=indexedDB.open('ff-gate0-design-only',1);q.onupgradeneeded=()=>q.result.createObjectStore('drafts');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}))}async function storeDraft(value){if(state.storage!=='persistent')return;try{if(state.scenario==='storage')throw Error('Unavailable');const d=await db();await new Promise((resolve,reject)=>{const t=d.transaction('drafts','readwrite');value?t.objectStore('drafts').put(value,'demo-owner:'+state.record.id):t.objectStore('drafts').delete('demo-owner:'+state.record.id);t.oncomplete=resolve;t.onerror=reject});state.draftState='Saved on this device';state.storageError=false}catch(e){state.storageError=true;state.draftState='Device save unavailable'}renderIsland()}
async function recoverDraft(){if(state.storage!=='persistent')return;try{const d=await db();const saved=await new Promise((resolve,reject)=>{const q=d.transaction('drafts').objectStore('drafts').get('demo-owner:'+state.record.id);q.onsuccess=()=>resolve(q.result);q.onerror=reject});if(saved){state.edit=saved;state.draftState='Recovered on this device';renderDetail();toast('Recovered this record’s local draft.')}}catch{toast('Local storage unavailable. Your edits remain in this tab.')}}
function toggleNav(on){document.body.classList.toggle('navopen',on);const mobile=matchMedia('(max-width:760px)').matches;document.querySelector('aside').inert=mobile&&!on;document.querySelector('main').inert=mobile&&on;document.querySelector('.mobilemenu').setAttribute('aria-expanded',String(on));if(mobile)(on?document.querySelector('aside button'):document.querySelector('.mobilemenu'))?.focus()}function toast(s){$('toast').className='toast';$('toast').textContent=s;setTimeout(()=>{$('toast').className='';$('toast').textContent=''},4500)}function unavailable(s){toast(s+' is outside this Products and Orders design study.')}function navigate(page){if(page==='home')page='orders';if(dirty()){confirmLeave(()=>navigateClean(page));return}navigateClean(page)}function navigateClean(page){state.page=page;state.tab='All';state.query='';state.record=null;state.edit=null;state.selected.clear();toggleNav(false);render()}function changeDirection(v){if(dirty()){confirmLeave(()=>{state.direction=v;closeRecord();render()});$('direction').value=state.direction;return}state.direction=v;closeRecord();render()}function changeStorage(v){state.storage=v;if(state.record&&state.page==='products'){if(dirty())storeDraft(state.edit);else recoverDraft()}toast(v==='persistent'?'Device recovery enabled for this demo record.':'Edits stay in memory until you publish.');renderIsland()}function setScenario(v){state.scenario=v;if(state.record)renderDetail();else render()}
function dirty(){return state.page==='products'&&state.record&&state.edit&&['title','description'].some(k=>state.edit[k]!==state.record[k])}function changed(){return ['title','description'].filter(k=>state.edit[k]!==state.record[k])}function confirmLeave(fn){modal('Leave with unpublished changes?',`<p>Publish or discard before leaving. ${state.storage==='persistent'?'A device draft can be recovered here later.':'These changes exist only in this tab.'}</p>`,[{text:'Keep editing',action:closeModal},{text:state.storage==='persistent'?'Leave with device draft':'Discard and leave',action:()=>{state.edit=null;closeModal();fn()}}])}
function closeRecord(){state.record=null;state.edit=null;state.newProduct=false;$('overlay').innerHTML='';$('island').innerHTML='';if(state.trigger)state.trigger.focus()}
function restoreRecordFocus(){const label=state.trigger?.textContent;[...document.querySelectorAll('#app button')].find(b=>b.textContent===label)?.focus()}function back(){if(dirty())confirmLeave(()=>{closeRecord();render();restoreRecordFocus()});else{closeRecord();render();restoreRecordFocus()}}
function notice(){const m={success:['','Changes saved. This is a simulated success state.'],error:['error','We could not load the latest data. Your existing changes are safe. Try again.'],uncertain:['warning','We did not receive confirmation. Check the recorded outcome before retrying.'],conflict:['warning','Someone else changed this record. Review the latest version before publishing.'],storage:['warning','Device storage is unavailable. Keep this tab open or export your draft.']}[state.scenario];return m?`<div class="notice ${m[0]}" role="status">${m[1]} ${state.scenario==='storage'?'<button class="quiet" onclick="exportDraft()">Export draft</button>':''}</div>`:''}
function render(){for(const p of ['products','orders'])$('nav-'+p).classList.toggle('active',state.page===p);$('direction').value=state.direction;if(state.record&&state.direction==='workspace'){renderDetail();return}$('overlay').innerHTML='';$('island').innerHTML='';const isProduct=state.page==='products';$('app').innerHTML=`<div class="topline"><div><span class="eyebrow">${isProduct?'Your catalog':'Daily operations'}</span><h1>${isProduct?'Products':'Orders'}</h1><p>${isProduct?'Make something worth finding.':'A clear next step for every order.'}</p></div><button class="primary" onclick="${isProduct?'createProduct()':'packingSlips()'}">${isProduct?'+ Add product':'Print packing slips'}</button></div>${notice()}<div class="summary">${isProduct?stat('Active products','4','Ready for your storefront')+stat('Draft products','1','Still taking shape')+stat('Low stock','1','Needs your attention'):stat('To fulfill','2','Paid and ready to pack')+stat('Shipped today','1','On the way')+stat('Returns','1','Needs a decision')}</div><div class="workspace"><div class="toolbar"><div class="tabs" role="group" aria-label="${isProduct?'Product':'Order'} views">${(isProduct?['All','Active','Draft','Out of stock']:['All','Unfulfilled','Shipped','Returns']).map(t=>`<button class="${state.tab===t?'active':''}" aria-pressed="${state.tab===t}" onclick="setTab('${t}')">${t}</button>`).join('')}</div><input id="search" class="search" type="search" aria-label="${isProduct?'Search products by title or exact SKU':'Search orders by number or email'}" placeholder="${isProduct?'⌕  Search title or SKU':'⌕  Search order or email'}" value="${esc(state.query)}" oninput="search(this.value)"></div><div id="list"></div></div><p class="muted small" style="margin-top:18px">${state.direction==='workspace'?'Direction A · Records open in dedicated workspaces.':'Direction B · Quick tasks open beside the list.'} All data and actions in this study are simulated.</p>`;renderList()}
function stat(label,n,sub){return `<div class="stat"><span class="muted">${label}</span><strong>${n}</strong><small>${sub}</small></div>`}function setTab(t){state.tab=t;render()}function search(q){state.query=q;renderList()}
function renderList(){if(state.scenario==='loading'){$('list').innerHTML='<div style="padding:20px" aria-busy="true" aria-label="Loading records">'+Array(5).fill('<div class="skeleton"></div>').join('')+'</div>';return}if(state.scenario==='denied'){$('list').innerHTML='<div class="empty"><h2>You do not have access to these records</h2><p>Ask the store owner to update your permissions.</p></div>';return}const p=state.page==='products',q=state.query.toLowerCase();const rows=(p?products:orders).filter(r=>(p?[r.title,r.sku]:[r.number,r.email,r.name]).some(v=>v.toLowerCase().includes(q))).filter(r=>state.tab==='All'||(state.tab==='Out of stock'?r.stock===0:state.tab==='Returns'?r.status==='Return requested':r.status===state.tab));if(!rows.length||state.scenario==='empty'){$('list').innerHTML=`<div class="empty"><h2>${state.query?'No matches found':p?'Your next idea starts here':'You’re all caught up'}</h2><p>${state.query?'Try another title, SKU, order number or email.':p?'Add your first product and bring your store to life.':'New orders that need attention will appear here.'}</p>${p?'<button class="primary" onclick="createProduct()">Add product</button>':''}</div>`;return}$('list').innerHTML=`<div class="tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="Select visible records" onchange="selectAll(this.checked)"></th>${(p?['Product','Status','Inventory','Price']:['Order','Customer','Payment','Fulfillment','Total']).map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>p?`<tr><td><input type="checkbox" aria-label="Select ${esc(r.title)}" data-select="${r.id}" onchange="selectOne('${r.id}',this.checked)"></td><td><div class="productcell"><div class="thumb ${r.color}" aria-hidden="true">${r.icon}</div><div><button class="link" onclick="openRecord('${r.id}',this)">${esc(r.title)}</button><div class="subline">${esc(r.sku)} · ${r.variants} variant${r.variants>1?'s':''}</div></div></div></td><td><span class="badge ${r.status==='Active'?'green':''}">${r.status}</span></td><td>${r.stock===0?'<span style="color:#9b7133">Out of stock</span>':r.stock+' available'}</td><td>${money(r.price)}</td></tr>`:`<tr><td><input type="checkbox" aria-label="Select ${r.number}" data-select="${r.id}" onchange="selectOne('${r.id}',this.checked)"></td><td><button class="link" onclick="openRecord('${r.id}',this)">${r.number}</button><div class="subline">${r.date}</div></td><td>${r.name}<div class="subline">${r.email}</div></td><td><span class="badge green">Paid</span></td><td><span class="badge ${r.status==='Unfulfilled'?'amber':r.status==='Return requested'?'red':''}">${r.status}</span></td><td>${money(r.total)}</td></tr>`).join('')}</tbody></table></div><div class="tablefoot"><span id="selection">Showing ${rows.length} ${p?'products':'orders'} · Demo dataset</span><span><button disabled>Previous</button> <button disabled>Next</button></span></div>`}
function selectOne(id,on){on?state.selected.add(id):state.selected.delete(id);$('selection').textContent=state.selected.size+' selected';}function selectAll(on){document.querySelectorAll('[data-select]').forEach(el=>{el.checked=on;selectOne(el.dataset.select,on)})}
async function openRecord(id,trigger){state.trigger=trigger;state.record=(state.page==='products'?products:orders).find(r=>r.id===id);state.edit={...state.record};state.draftState='Editing';renderDetail();await recoverDraft()}
function createProduct(){state.draftState='Not published';state.newProduct=true;state.page='products';state.record={id:'new-product',title:'',description:'',status:'Draft',variants:0,price:4800,sku:'',stock:0,color:'',icon:'♜'};state.edit={...state.record};renderDetail()}
function renderDetail(){const p=state.page==='products',r=state.record;if(!r)return;const html=`<div class="breadcrumb"><button onclick="back()">← ${p?'Products':'Orders'}</button> &nbsp; / &nbsp; ${esc(state.newProduct?'New product':p?r.title:r.number)}</div><div class="topline"><div><span class="eyebrow">${p?'Product workspace':'Order workspace'}</span><h1>${esc(state.newProduct?'Add a product':p?r.title:r.number)}</h1><span class="badge ${p?(r.status==='Active'?'green':''):'green'}">${p?r.status:'Paid'}</span> ${!p?'<span class="badge amber">'+r.status+'</span>':''}</div>${state.direction==='panel'?'<button class="quiet" onclick="back()" aria-label="Close record panel">✕</button>':p?'':'<button onclick="packingSlips()">Print packing slip</button>'}</div>${notice()}${p?productEditor():orderEditor()}`;if(state.direction==='panel'){$('overlay').innerHTML=`<div class="sheetback" onclick="if(event.target===this)back()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${p?'Product':'Order'} record">${html}<div id="sheet-island"></div></section></div>`;setTimeout(()=>document.querySelector('.sheet button')?.focus(),0)}else{$('app').innerHTML=html;$('overlay').innerHTML=''}renderIsland()}
function productEditor(){const r=state.edit;return `<div class="editorgrid"><div><section class="panel"><h2>Make it yours</h2><div class="field"><label for="title">Product name</label><input id="title" value="${esc(r.title)}" placeholder="A name your customers will remember" oninput="editField('title',this.value)"></div><div class="field"><label for="description">Description</label><textarea id="description" oninput="editField('description',this.value)">${esc(r.description)}</textarea><small>Plain-text prototype. Rich content requires a separate rendering and sanitization contract.</small></div></section><section class="panel"><h2>Photos</h2><div class="photobox"><div class="photo" role="img" aria-label="Illustrative product placeholder">♜</div><button class="photo add" onclick="toast('Media selection is a simulated entry point.')" aria-label="Add product photo">+</button></div></section><section class="panel"><div class="topline" style="margin-bottom:15px"><div><h2 style="margin:0">Options and variants</h2><p class="small">Build the combinations your customers can buy.</p></div><button onclick="generateVariants()">${r.variants?'Edit options':'Add options'}</button></div><div id="variants">${r.variants?variantRows(r.variants):'<p class="muted small">Start with one product or add size and color options.</p>'}</div></section></div><div><section class="panel soft"><h3>Storefront</h3><p class="muted small">${state.newProduct?'Start as a draft. Publish when the product is ready.':'This product is available in your online store. Content edits stay unpublished until you choose Publish.'}</p><span class="badge ${state.record.status==='Active'?'green':''}">${state.record.status}</span></section><section class="panel"><h3>Inventory is immediate</h3><p class="muted small">Stock changes belong in Inventory. They are not collected in a content draft.</p><button onclick="toast('Inventory adjustments are immediate and outside this draft.')">View inventory ↗</button></section><section class="panel"><h3>Draft recovery</h3><p class="muted small">${state.storage==='persistent'?'Saved only in this browser. Device storage can be cleared or lost.':'Edits stay in this tab. Navigation prompts before changes are discarded.'}</p><button onclick="simulateConflict()">Try a conflict</button></section></div></div>`}
function variantRows(n){return `<div class="tablewrap"><table><thead><tr><th>Variant</th><th>SKU</th><th>Price</th></tr></thead><tbody>${Array.from({length:n},(_,i)=>`<tr><td>${['Small','Medium','Large'][Math.floor(i/2)]||'One size'} / ${i%2?'Stone':'Black'}</td><td>FF-TEE-${i%2?'STN':'BLK'}-${['S','M','L'][Math.floor(i/2)]||'OS'}</td><td>$48.00</td></tr>`).join('')}</tbody></table></div>`}
function generateVariants(){modal('Add size and color options',`<div class="field"><label for="sizes">Sizes</label><input id="sizes" value="Small, Medium, Large"></div><div class="field"><label for="colors">Colors</label><input id="colors" value="Black, Stone"></div><p class="small muted">This study generates the illustrated six combinations. SKU and price writes are not implemented.</p>`,[{text:'Cancel',action:closeModal},{text:'Generate 6 variants',primary:true,action:()=>{state.edit.variants=6;$('variants').innerHTML=variantRows(6);closeModal();toast('6 unique variant combinations generated.');renderIsland()}}])}
function editField(k,v){state.edit[k]=v;state.draftState=state.storage==='persistent'?'Saving on device…':'Not published';renderIsland();clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>storeDraft({...state.edit}),500)}
function renderIsland(){const container=$('sheet-island')||$('island');if(!container)return;const n=state.edit&&state.record?changed().length:0;container.innerHTML=state.page==='products'&&state.record&&(n||state.newProduct)?`<div class="island"><div><strong>${n||1} pending change${n===1?'':'s'}</strong><small>${esc(state.draftState)}</small></div><button class="quiet" onclick="discard()">Discard</button><button class="quiet" onclick="review()">Review</button><button class="publish" onclick="publish()">${state.newProduct?'Save draft':'Publish'}</button></div>`:''}
function discard(){state.edit={...state.record};storeDraft(null);renderDetail();toast('Unpublished changes discarded.')}function review(){modal('Review your changes',changed().map(k=>`<div class="diff"><h3>${k==='title'?'Product name':'Description'}</h3><del>${esc(state.record[k])||'(empty)'}</del><ins>${esc(state.edit[k])||'(empty)'}</ins></div>`).join('')||'<p>This new product is ready to save as a draft.</p>',[{text:'Keep editing',action:closeModal},{text:state.newProduct?'Save draft':'Publish changes',primary:true,action:()=>{closeModal();publish()}}])}
function publish(){if(!state.edit.title.trim()){toast('Add a product name before saving.');$('title')?.focus();return}if(state.scenario==='conflict'){simulateConflict();return}if(state.scenario==='error'){toast('Publish failed. Your edits are still here.');return}if(state.scenario==='uncertain'){modal('Check before retrying',`<p>The response was interrupted. This prototype simulates an unknown outcome. A real implementation must look up this operation before offering a retry.</p>`,[{text:'Keep draft',action:closeModal},{text:'Check recorded outcome',primary:true,action:()=>{closeModal();state.scenario='normal';$('scenario').value='normal';finishPublish()}}]);return}state.draftState='Publishing…';renderIsland();setTimeout(finishPublish,600)}
function finishPublish(){Object.assign(state.record,state.edit);if(state.newProduct){state.record.id='demo-'+Date.now();state.record.status='Draft';products.unshift(state.record);state.newProduct=false}storeDraft(null);state.draftState='Accepted · delivering';renderDetail();toast('Simulated save accepted. Delivery is a separate step.');setTimeout(()=>{state.draftState='Delivered · storefront may still propagate';toast('Simulated publication delivered. This does not prove global visibility.')},1100)}
function simulateConflict(){state.scenario='conflict';$('scenario').value='conflict';modal('Review a newer version',`<p>Another staff member changed this record after you opened it. Your changes have not been overwritten.</p><div class="diff"><h3>Demo conflict</h3><del>Your base revision: 12</del><ins>Current revision: 13</ins></div><p class="small muted">This is a simulated conflict. The application must perform an atomic revision check before any write.</p>`,[{text:'Keep my draft',action:closeModal},{text:'Reload latest',primary:true,action:()=>{state.scenario='normal';$('scenario').value='normal';state.edit={...state.record};closeModal();renderDetail()}}])}
function exportDraft(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({prototype:true,record:state.edit},null,2)],{type:'application/json'}));a.download='fully-flared-demo-draft.json';a.click();URL.revokeObjectURL(a.href)}
function orderEditor(){const r=state.record;return `<div class="editorgrid"><div><section class="panel"><div class="topline" style="margin-bottom:17px"><h2 style="margin:0">${r.status==='Return approved'?'Await returned items':r.status==='Return requested'?'Review this return':r.status==='Shipped'?'On its way':'Ready to fulfill'}</h2><span class="muted small">${r.items} item${r.items>1?'s':''}</span></div><div class="productcell"><div class="thumb dark" aria-hidden="true">♜</div><div><strong class="small">Everyday Heavyweight Tee</strong><div class="subline">Black / Medium · FF-TEE-BLK-M</div></div><span style="margin-left:auto">× ${r.items}</span><strong class="small">${money(r.total)}</strong></div><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><p class="muted small">${r.status==='Return approved'?'The return is approved. Receive the item before a separate refund or restock decision.':r.status==='Return requested'?'Reason: The size wasn’t quite right. Review the request before authorizing a return.':'Payment is complete. Confirm the packed items, then record the shipment.'}</p><button class="primary" onclick="${r.status==='Return approved'?'toast(\'Receiving and refunds are outside this prototype.\')':r.status==='Return requested'?'reviewReturn()':r.status==='Shipped'?'toast(\'Tracking is a simulated entry point.\')':'shipOrder()'}">${r.status==='Return approved'?'View return instructions':r.status==='Return requested'?'Review return':r.status==='Shipped'?'View tracking':'Mark as shipped'}</button> <button onclick="packingSlips()">Print packing slip</button></section><section class="panel"><h2>Payment</h2><div class="row"><span class="muted">Total paid</span><strong style="text-align:right">${money(r.total)} USD</strong></div><p class="small muted">Paid by card · Test transaction</p><button class="quiet" onclick="toast('Refunds require a full financial review and are outside this design study.')">Review refund options ↗</button></section><section class="panel"><h2>Activity</h2><div class="timeline"><p>Payment confirmed <span class="muted">· ${r.date}</span></p><p>Order received</p></div></section></div><div><section class="panel soft"><h3>Customer</h3><p>${r.name}<br><span class="small muted">${r.email}</span></p><button class="quiet" onclick="toast('Customer identity grouping requires the privacy contract in Gate 0.')">View customer ↗</button></section><section class="panel"><h3>Ship to</h3><p class="small muted">${r.name}<br>123 Example Street<br>Brooklyn, NY 11201<br>United States</p><span class="badge">Standard shipping</span></section><section class="panel"><h3>What happens next</h3><p class="small muted">Shipping is an immediate operation. It never joins a product publishing draft.</p></section></div></div>`}
function shipOrder(){modal('Confirm shipment',`<p>Confirm that all ${state.record.items} items in ${state.record.number} are packed and ready to leave.</p><div class="field"><label for="tracking">Tracking number</label><input id="tracking" placeholder="Optional tracking number"></div><p class="small muted">The real workflow must persist one operation outcome and send at most one notification.</p>`,[{text:'Cancel',action:closeModal},{text:'Confirm shipment',primary:true,action:()=>{if(state.scenario==='error'){toast('Shipment failed. No simulated update applied.');return}if(state.scenario==='uncertain'){closeModal();toast('Outcome unknown. Check shipment status before retrying.');return}state.record.status='Shipped';closeModal();renderDetail();toast('Shipment recorded. Simulated notification sent once.')}}])}
function packingSlips(){const selected=orders.filter(o=>state.selected.has(o.id));const rows=state.record&&state.page==='orders'?[state.record]:selected.length?selected:orders.filter(o=>o.status==='Unfulfilled');modal('Packing slips',`<p class="small muted">${rows.length} simulated packing slip${rows.length===1?'':'s'}. No carrier label purchase.</p>${rows.map(o=>`<div class="diff"><h3>${o.number} · ${o.name}</h3><p>${o.items} × Everyday Heavyweight Tee<br>FF-TEE-BLK-M<br>123 Example Street, Brooklyn NY 11201</p></div>`).join('')}`,[{text:'Close',action:closeModal},{text:'Print',primary:true,action:()=>window.print()}])}
function reviewReturn(){modal('Review return '+state.record.number,`<p>${esc(state.record.name)} requests a return because the size was not right.</p><div class="diff"><h3>1 × Everyday Heavyweight Tee</h3><p>Requested amount: ${money(state.record.total)}</p></div><p class="small muted">Approving a return is separate from issuing a refund or restocking inventory.</p>`,[{text:'Keep reviewing',action:closeModal},{text:'Approve return',primary:true,action:()=>{state.record.status='Return approved';closeModal();renderDetail();toast('Return approved. No refund or stock adjustment was performed.')}}])}
let modalTrigger;function modal(title,body,actions){modalTrigger=document.activeElement;$('dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}<div class="actions">${actions.map((a,i)=>`<button class="${a.primary?'primary':''}" data-action="${i}">${a.text}</button>`).join('')}</div>`;actions.forEach((a,i)=>$('dialog').querySelector('[data-action="'+i+'"]').onclick=a.action);$('dialog').showModal()}function closeModal(){$('dialog').close();modalTrigger?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&document.body.classList.contains('navopen')){const nodes=[...document.querySelectorAll('aside button')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}if(e.key==='Escape'&&!$('dialog').open){if(state.record&&state.direction==='panel'){e.preventDefault();back()}toggleNav(false)}if(e.key==='Tab'&&state.record&&state.direction==='panel'&&!$('dialog').open){const nodes=[...document.querySelectorAll('.sheet button,.sheet input,.sheet select,.sheet textarea')].filter(n=>!n.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('beforeunload',e=>{if(dirty()&&state.storage==='memory'){e.preventDefault();e.returnValue=''}});render();const mobileQuery=matchMedia('(max-width:760px)');mobileQuery.addEventListener('change',()=>toggleNav(false));toggleNav(false);
</script></body></html>
