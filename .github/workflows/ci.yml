name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The test suite imports web/ sources, which resolve packages from
      # web/node_modules (zod, drizzle-orm, stripe v23, better-auth).
      # Without this install the suite cannot even collect in CI.
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Generate Worker types
        run: cd web && npm run cf-typegen

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm exec -- vitest run --exclude tests/catalog-scale-100k.test.ts

      - name: Migration drift and safety
        run: cd web && npm run check:migrations

  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Generate Worker types
        run: cd web && npx wrangler types

      - name: Build web (Vite + typecheck)
        run: cd web && npm run build

      - name: Bundle boundaries (no zod in the browser, lean Worker startup)
        run: cd web && npm run check:bundle

      - name: Check generated Worker types
        run: cd web && npx wrangler types --check

  scale-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: [lint-and-test, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci && npm --prefix web ci
      - run: npm --prefix web run cf-typegen
      - name: Isolated 100k catalog acceptance
        run: npm run test:scale

  # Per-change preview deployment (plan Step 0). Requires the repo secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the job is skipped (not
  # failed) on forks or clones that do not have them.
  preview-deploy:
    if: github.event_name == 'pull_request'
    needs: [lint-and-test, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping preview deploy."
            exit 0
          fi
          cd web
          node scripts/validate-deploy.mjs preview
          npx wrangler types
          CLOUDFLARE_ENV=preview npm run build
          npx wrangler deploy --env preview
